<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alocação de Carros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menu de Navegação -->
    <nav id="menu">
        <a href="#" onclick="mostrarPagina('pag-carros-disponiveis')">Carros Disponíveis</a>
        <a href="#" onclick="mostrarPagina('pag-cadastro-carros')">Cadastro de Carros</a>
        <a href="#" onclick="mostrarPagina('pag-cadastro-clientes')">Cadastro de Clientes</a>
    </nav>

    <!-- Conteúdo da Página de Carros Disponíveis -->
    <div id="pag-carros-disponiveis">
        <h1>Carros Disponíveis</h1>

        <div id="container-carros" section="carros"></div>

        <div id="container-alocar" section="alocar"></div>

        <div id="modal-cliente" class="modal">
            <div class="modal-conteudo">
                <h2>Escolha o cliente</h2>

                <select id="checkbox-cliente-alocar"></select>

                <div id="alocar-fechar">
                    <button id="btn-alocar" onclick="alocarCarro()">Alocar</button>
                    <button onclick="fecharModal()">Cancelar</button>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Conteúdo da Página de Cadastro de Veículos -->
    <div id="pag-cadastro-carros" class="pag-cadastro">
        <h1>Cadastro de Carros</h1>

        <input type="text" id="input-marca-carro" placeholder="Marca do Carro">
        <input type="text" id="input-modelo-carro" placeholder="Modelo do Carro">
        <button id="btn-cadastrar-carro" onclick="cadastrarCarro()">Cadastrar Carro</button>

    </div>

    <!-- Conteúdo da Página de Cadastro de Clientes -->
    <div id="pag-cadastro-clientes" class="pag-cadastro">
        <h1>Cadastro de Clientes</h1>

        <input type="text" id="input-nome-cliente" placeholder="Nome do Cliente">
        <input type="text" id="input-cpf-cliente" placeholder="CPF do Cliente">
        <button id="btn-cadastrar-cliente" onclick="cadastrarCliente()">Cadastrar Cliente</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
